<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo IoT Home</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .dashboard {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }
        .cards-container {
            display: flex;
            gap: 20px;
            width: 100%;
        }
        
        @media (max-width: 600px) {
            .cards-container {
                flex-direction: column;
            }
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            flex: 1;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
        }
        .temp-card::before { background: #e74c3c; }
        .hum-card::before { background: #3498db; }
        .chart-card::before { background: #2ecc71; }
        .history-card { width: 100%; max-width: 800px; } /* Ajuste ancho tabla */
        .history-card::before { background: #9b59b6; }
        
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .card-data {
            display: flex;
            align-items: baseline;
        }
        .value {
            font-size: 3.5rem;
            font-weight: 800;
            color: #2c3e50;
        }
        .unit {
            font-size: 1.5rem;
            font-weight: 600;
            margin-left: 5px;
        }
        .temp-card .unit { color: #e74c3c; }
        .hum-card .unit { color: #3498db; }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .status-footer {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .time-badge {
            background: #e8f4f8;
            color: #2980b9;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .connection-status {
            font-size: 0.8rem;
            color: #bdc3c7;
        }
        .filtros {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filtros button {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .filtros button:hover {
            background: #2980b9;
        }

        .filtros input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .tabla-container {
            overflow-x: auto;
            width: 100%;
            max-height: 400px; /* Scroll para muchos datos */
        }

        #tablaLecturas {
            width: 100%;
            border-collapse: collapse;
        }

        #tablaLecturas th,
        #tablaLecturas td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        #tablaLecturas th {
            background: #f4f6f9;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        
    </style>
</head>
<body>

    <div class="header">
        <h1>IoT Smart Telemetry</h1>
        <p>Monitoreo en tiempo real desde la nube</p>
    </div>

    <div class="dashboard">
        <div class="cards-container">
            <div class="card temp-card">
                <div class="card-title">Temperatura</div>
                <div class="card-data">
                    <span id="temp" class="value">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>

            <div class="card hum-card">
                <div class="card-title">Humedad Ambiente</div>
                <div class="card-data">
                    <span id="hum" class="value">--</span>
                    <span class="unit">%</span>
                </div>
            </div>
        </div>

        <div class="card chart-card">
            <div class="card-title">Historial Reciente</div>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card history-card">
        <div class="card-title">Historial por Fecha</div>

        <div class="filtros">
            <input type="date" id="fechaFiltro">
            <button id="btnFiltrar">Filtrar</button>
            <button id="btnCSV">Descargar CSV</button>
        </div>

        <div class="tabla-container">
            <table id="tablaLecturas">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Temperatura (°C)</th>
                        <th>Humedad (%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="3">Selecciona una fecha para ver los datos</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="status-footer">
        <div class="time-badge" id="timestamp">
            ⏳ Esperando datos del sensor...
        </div>
        <div class="connection-status">
            Conectado a Firebase RTDB
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAv81YNKQ76L4aPJgzKXsh4BSBFSCmbga8",
            authDomain: "iot-home-709a9.firebaseapp.com",
            databaseURL: "https://iot-home-709a9-default-rtdb.firebaseio.com",
            projectId: "iot-home-709a9",
            storageBucket: "iot-home-709a9.firebasestorage.app",
            messagingSenderId: "979997806461",
            appId: "1:979997806461:web:bc8deefcd688277148c614"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- CONFIGURACIÓN DEL GRÁFICO (Chart.js) ---
        const ctx = document.getElementById('myChart').getContext('2d');
        const miGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: [],
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 2,
                        tension: 0.4, 
                        fill: true,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Humedad (%)',
                        data: [], 
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        type: 'linear', display: true, position: 'left',
                        title: { display: true, text: 'Temperatura (°C)' }
                    },
                    y1: {
                        type: 'linear', display: true, position: 'right',
                        title: { display: true, text: 'Humedad (%)' },
                        grid: { drawOnChartArea: false } 
                    }
                },
                plugins: { legend: { position: 'top' } }
            }
        });


        // --- LECTURA DE FIREBASE Y LÓGICA DE TABLA ---
        const historialRef = ref(db, 'sensor/historial');
        let registrosCompletos = [];

        onValue(historialRef, (snapshot) => {
            const horas = [];
            const temps = [];
            const hums = [];
            let ultimoDato = null;
            
            // Vaciamos el arreglo antes de llenarlo con la data actualizada
            registrosCompletos = [];

            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                if (data !== null) {
                    registrosCompletos.push(data); // Guardar para la tabla
                    ultimoDato = data; 
                    
                    const fechaObj = new Date(data.timestamp);
                    const horaFormateada = fechaObj.toLocaleTimeString('es-ES', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    horas.push(horaFormateada);
                    temps.push(data.temp);
                    hums.push(data.hum);
                }
            });

            // Actualización de Tarjetas y Gráfico
            if (ultimoDato !== null) {
                document.getElementById('temp').innerText = Number(ultimoDato.temp).toFixed(1);
                document.getElementById('hum').innerText = Number(ultimoDato.hum).toFixed(1);

                const fechaFinal = new Date(ultimoDato.timestamp);
                const fechaStr = fechaFinal.toLocaleDateString('es-ES');
                const horaStr = fechaFinal.toLocaleTimeString('es-ES', { 
                    hour: '2-digit', minute: '2-digit' 
                });
                document.getElementById('timestamp').innerText = `Última lectura: ${fechaStr} a las ${horaStr}`;

                miGrafico.data.labels = horas;
                miGrafico.data.datasets[0].data = temps;
                miGrafico.data.datasets[1].data = hums;
                miGrafico.update(); 
            }

            // Seleccionar automáticamente el día de hoy si no hay fecha seleccionada
            const inputFecha = document.getElementById('fechaFiltro');
            if (!inputFecha.value && ultimoDato !== null) {
                const hoy = new Date();
                // Formato YYYY-MM-DD necesario para el input type="date"
                inputFecha.value = hoy.toISOString().split('T')[0]; 
            }
            
            // Actualizar la tabla con la fecha actual si ya tenemos registros
            filtrarPorFecha();
        });

        // --- FUNCIONES PARA LA TABLA Y FILTROS ---
        function filtrarPorFecha() {
            const fechaSeleccionada = document.getElementById('fechaFiltro').value;
            if (!fechaSeleccionada) return;

            // Filtramos comparando el string YYYY-MM-DD local
            const datosFiltrados = registrosCompletos.filter(dato => {
                const d = new Date(dato.timestamp);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const fechaStr = `${year}-${month}-${day}`;
                
                return fechaStr === fechaSeleccionada;
            });

            renderTabla(datosFiltrados);
        }

        function renderTabla(datos) {
            const tbody = document.querySelector('#tablaLecturas tbody');
            tbody.innerHTML = '';

            if (datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No hay datos para esta fecha</td></tr>';
                return;
            }

            // Invertimos para mostrar los más recientes arriba de la tabla
            const datosInvertidos = [...datos].reverse();

            datosInvertidos.forEach(dato => {
                const d = new Date(dato.timestamp);
                const hora = d.toLocaleTimeString('es-ES', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${hora}</td>
                    <td>${Number(dato.temp).toFixed(1)}</td>
                    <td>${Number(dato.hum).toFixed(1)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function descargarCSV() {
            const tbody = document.querySelector('#tablaLecturas tbody');
            const filas = tbody.querySelectorAll('tr');
            
            // Si la tabla dice "No hay datos..." no descargamos nada
            if (filas.length === 0 || filas[0].innerText.includes("No hay datos")) {
                alert("No hay datos en la tabla para exportar.");
                return;
            }

            // Cabeceras del CSV
            let csvContent = "Hora,Temperatura (°C),Humedad (%)\n";
            
            // Extracción de datos
            filas.forEach(fila => {
                const columnas = fila.querySelectorAll('td');
                const rowData = Array.from(columnas).map(col => col.innerText);
                csvContent += rowData.join(",") + "\n";
            });

            // Generación de la descarga
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fechaD = document.getElementById('fechaFiltro').value || 'historial';
            
            a.setAttribute('href', url);
            a.setAttribute('download', `telemetria_${fechaD}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Asignar los eventos a los botones
        document.getElementById('btnFiltrar').addEventListener('click', filtrarPorFecha);
        document.getElementById('btnCSV').addEventListener('click', descargarCSV);

    </script>
</body>
</html>
