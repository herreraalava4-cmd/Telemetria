<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo IoT Home</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .dashboard {
            width: 100%;
            max-width: 800px; /* Ampliado para que quepa el gráfico */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .cards-container {
            display: flex;
            gap: 20px;
            width: 100%;
        }
        
        /* Ajuste responsivo para las tarjetas */
        @media (max-width: 600px) {
            .cards-container {
                flex-direction: column;
            }
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            flex: 1; /* Hace que las tarjetas compartan el espacio equitativamente */
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
        }
        .temp-card::before { background: #e74c3c; }
        .hum-card::before { background: #3498db; }
        .chart-card::before { background: #2ecc71; } /* Color para la tarjeta del gráfico */
        
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .card-data {
            display: flex;
            align-items: baseline;
        }
        .value {
            font-size: 3.5rem;
            font-weight: 800;
            color: #2c3e50;
        }
        .unit {
            font-size: 1.5rem;
            font-weight: 600;
            margin-left: 5px;
        }
        .temp-card .unit { color: #e74c3c; }
        .hum-card .unit { color: #3498db; }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .status-footer {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .time-badge {
            background: #e8f4f8;
            color: #2980b9;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .connection-status {
            font-size: 0.8rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>IoT Smart Telemetry</h1>
        <p>Monitoreo en tiempo real desde la nube</p>
    </div>

    <div class="dashboard">
        <div class="cards-container">
            <div class="card temp-card">
                <div class="card-title">Temperatura</div>
                <div class="card-data">
                    <span id="temp" class="value">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>

            <div class="card hum-card">
                <div class="card-title">Humedad Ambiente</div>
                <div class="card-data">
                    <span id="hum" class="value">--</span>
                    <span class="unit">%</span>
                </div>
            </div>
        </div>

        <div class="card chart-card">
            <div class="card-title">Historial Reciente</div>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <div class="status-footer">
        <div class="time-badge" id="timestamp">
            ⏳ Esperando datos del sensor...
        </div>
        <div class="connection-status">
            Conectado a Firebase RTDB
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAv81YNKQ76L4aPJgzKXsh4BSBFSCmbga8",
            authDomain: "iot-home-709a9.firebaseapp.com",
            databaseURL: "https://iot-home-709a9-default-rtdb.firebaseio.com",
            projectId: "iot-home-709a9",
            storageBucket: "iot-home-709a9.firebasestorage.app",
            messagingSenderId: "979997806461",
            appId: "1:979997806461:web:bc8deefcd688277148c614"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- CONFIGURACIÓN DEL GRÁFICO (Chart.js) ---
        const ctx = document.getElementById('myChart').getContext('2d');
        const miGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Aquí irán las horas
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: [], // Aquí irán los datos de temperatura
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 2,
                        tension: 0.4, // Curvas suaves
                        fill: true,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Humedad (%)',
                        data: [], // Aquí irán los datos de humedad
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Temperatura (°C)' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'Humedad (%)' },
                        grid: { drawOnChartArea: false } // Para no cruzar las líneas de la cuadrícula
                    }
                },
                plugins: {
                    legend: { position: 'top' }
                }
            }
        });


        // --- LECTURA DE FIREBASE ---
        // Ahora pedimos los ÚLTIMOS 20 registros en lugar de solo 1
        const historialRef = query(ref(db, 'sensor/historial'), limitToLast(20));

        onValue(historialRef, (snapshot) => {
            // Arrays temporales para reconstruir el gráfico con los nuevos datos
            const horas = [];
            const temps = [];
            const hums = [];
            let ultimoDato = null;

            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                if (data !== null) {
                    ultimoDato = data; // Vamos guardando para saber cuál fue el último
                    
                    // Formateamos la hora para la etiqueta del gráfico (e.g. "22:15")
                    const fechaObj = new Date(data.timestamp);
                    const horaFormateada = fechaObj.toLocaleTimeString('es-ES', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    horas.push(horaFormateada);
                    temps.push(data.temp);
                    hums.push(data.hum);
                }
            });

            // Si recibimos datos, actualizamos la web
            if (ultimoDato !== null) {
                // 1. Actualizar Tarjetas Principales con el último dato
                document.getElementById('temp').innerText = Number(ultimoDato.temp).toFixed(1);
                document.getElementById('hum').innerText = Number(ultimoDato.hum).toFixed(1);

                // 2. Actualizar el Mensaje de Timestamp
                const fechaFinal = new Date(ultimoDato.timestamp);
                const fechaStr = fechaFinal.toLocaleDateString('es-ES');
                const horaStr = fechaFinal.toLocaleTimeString('es-ES', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                document.getElementById('timestamp').innerText = `Última lectura: ${fechaStr} a las ${horaStr}`;

                // 3. Actualizar el Gráfico
                miGrafico.data.labels = horas;
                miGrafico.data.datasets[0].data = temps;
                miGrafico.data.datasets[1].data = hums;
                miGrafico.update(); // Ordenamos a Chart.js redibujar
            }
        });
    </script>
</body>
</html>
